<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlatWeb Safe Search</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#05070a;
    color:white;
    font-family:"JetBrains Mono", monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    flex-direction:column;
    text-align:center;
}

h1{
    font-size:64px;
    margin-bottom:20px;
}

input{
    width:80%;
    max-width:600px;
    padding:16px;
    font-size:18px;
    border-radius:12px;
    border:1px solid #333;
    background:#111;
    color:white;
    outline:none;
}

button{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#58a6ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#2f81f7;
}

.small{
    margin-top:20px;
    color:#888;
    font-size:12px;
    max-width:500px;
}
</style>
</head>

<body>

<h1>FlatWeb</h1>

<input id="q" placeholder="Safe search the web..." autocomplete="off">
<button onclick="go()">Search</button>

<div class="small">
SafeSearch is always enabled. Explicit content is filtered as much as possible.
</div>

<script>

// basic keyword filter (light safety layer)
const blockedWords = [
    "porn","sex","xxx","nude","naked","hentai","nsfw","adult","escort"
];

function isUnsafe(text){
    text = text.toLowerCase();
    return blockedWords.some(word => text.includes(word));
}

// redirect logic
window.addEventListener("load", () => {

    const params = new URLSearchParams(window.location.search);
    let q = params.get("q");

    if(!q) return;

    if(isUnsafe(q)){
        document.body.innerHTML = `
            <h1>Blocked</h1>
            <p>This search is not allowed on Safe Search mode.</p>
        `;
        return;
    }

    const url =
    "https://www.google.com/search?q=" +
    encodeURIComponent(q) +
    "&safe=active";

    window.location.href = url;

});

function go(){

    const q = document.getElementById("q").value.trim();
    if(!q) return;

    window.location.href = "?q=" + encodeURIComponent(q);
}

document.getElementById("q").addEventListener("keydown", e=>{
    if(e.key === "Enter") go();
});

</script>

</body>
</html>
