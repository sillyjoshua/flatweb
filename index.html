<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlatWeb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05070a;
    color:white;
    font-family:"JetBrains Mono", monospace;
    overflow-x:hidden;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left, rgba(88,166,255,.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(157,107,255,.12), transparent 30%),
        linear-gradient(to bottom, #05070a, #0b1017);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:40px 40px;
    z-index:-1;
    mask-image:linear-gradient(to bottom, rgba(0,0,0,.8), transparent);
}

.container{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:50px 20px;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:100px;
}

.brand{
    font-size:24px;
    font-weight:800;
    letter-spacing:-2px;
}

.brand span{
    color:#58a6ff;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:#9aa4b2;
    text-decoration:none;
    font-size:14px;
    transition:.2s;
}

.nav-links a:hover{
    color:white;
}

.hero{
    text-align:center;
    margin-top:80px;
}

.logo{
    font-size:110px;
    font-weight:800;
    letter-spacing:-8px;
    line-height:1;

    background:linear-gradient(90deg,#58a6ff,#9d6bff,#5ee7a5,#58a6ff);
    background-size:300% 300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:gradient 10s ease infinite;
}

@keyframes gradient{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.subtitle{
    margin-top:18px;
    color:#8b949e;
    font-size:18px;
}

.search-wrapper{
    margin-top:50px;
    display:flex;
    justify-content:center;
}

.search-box{
    width:100%;
    max-width:850px;
    background:rgba(15,20,27,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:28px;
    padding:12px;

    display:flex;
    align-items:center;
    gap:14px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.03),
        0 20px 80px rgba(0,0,0,.45);

    transition:.25s;
}

.search-box:focus-within{
    border-color:#58a6ff;
    transform:translateY(-2px);
    box-shadow:
        0 0 0 1px rgba(88,166,255,.4),
        0 20px 100px rgba(88,166,255,.12);
}

.search-icon{
    font-size:22px;
    padding-left:12px;
    opacity:.8;
}

.search-box input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:white;
    font-size:18px;
    padding:16px 0;
    font-family:"JetBrains Mono", monospace;
}

.search-box input::placeholder{
    color:#6e7681;
}

.search-btn{
    border:none;
    background:linear-gradient(135deg,#58a6ff,#9d6bff);
    color:white;
    padding:16px 28px;
    border-radius:18px;
    cursor:pointer;
    font-family:"JetBrains Mono", monospace;
    font-weight:700;
    transition:.2s;
}

.search-btn:hover{
    transform:scale(1.04);
}

.quick-links{
    margin-top:28px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

.quick{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.03);
    color:#9aa4b2;
    padding:12px 18px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
    font-size:14px;
}

.quick:hover{
    border-color:#58a6ff;
    color:white;
    transform:translateY(-2px);
}

.results{
    margin-top:70px;
}

.result{
    background:rgba(15,20,27,.82);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:28px;
    margin-bottom:20px;

    backdrop-filter:blur(10px);

    transition:.25s;
}

.result:hover{
    border-color:#58a6ff;
    transform:translateY(-4px);
}

.result-top{
    color:#58a6ff;
    font-size:13px;
    margin-bottom:12px;
}

.result a{
    color:white;
    text-decoration:none;
    font-size:26px;
    font-weight:700;
    line-height:1.4;
}

.result a:hover{
    color:#58a6ff;
}

.result p{
    margin-top:16px;
    color:#b6bec9;
    line-height:1.8;
    font-size:15px;
}

.loading{
    text-align:center;
    margin-top:60px;
    color:#7d8590;
    font-size:18px;
}

.footer{
    margin-top:120px;
    text-align:center;
    color:#6e7681;
    padding-bottom:30px;
}

@media(max-width:700px){

    .logo{
        font-size:72px;
        letter-spacing:-5px;
    }

    .subtitle{
        font-size:15px;
    }

    .search-box{
        border-radius:22px;
    }

    .search-btn{
        padding:14px 18px;
        font-size:13px;
    }

    .nav-links{
        display:none;
    }

}
</style>
</head>
<body>

<div class="grid"></div>

<div class="container">

    <div class="nav">
        <div class="brand">flat<span>web</span></div>

        <div class="nav-links">
            <a href="#">Search</a>
            <a href="#">Images</a>
            <a href="#">Videos</a>
            <a href="#">News</a>
        </div>
    </div>

    <div class="hero">

        <div class="logo">FlatWeb</div>

        <div class="subtitle">
            Search the modern web instantly.
        </div>

        <div class="search-wrapper">

            <div class="search-box">

                <div class="search-icon">⌕</div>

                <input
                type="text"
                id="searchInput"
                placeholder="Search anything..."
                autocomplete="off"
                spellcheck="false">

                <button class="search-btn" onclick="searchWeb()">
                    Search
                </button>

            </div>

        </div>

        <div class="quick-links">
            <div class="quick" onclick="quickSearch('latest tech news')">tech</div>
            <div class="quick" onclick="quickSearch('gaming news')">gaming</div>
            <div class="quick" onclick="quickSearch('ai tools')">ai</div>
            <div class="quick" onclick="quickSearch('programming tutorials')">code</div>
            <div class="quick" onclick="quickSearch('music trending')">music</div>
        </div>

    </div>

    <div class="results" id="results"></div>

    <div class="footer">
        © 2026 FlatWeb — flatweb.pw
    </div>

</div>

<script>

function quickSearch(text){
    document.getElementById('searchInput').value = text;
    searchWeb();
}

async function searchWeb(){

    const input = document.getElementById('searchInput');
    const query = input.value.trim();
    const results = document.getElementById('results');

    if(!query) return;

    results.innerHTML = `
        <div class="loading">
            Searching the web for "${query}"...
        </div>
    `;

    try{

        const response = await fetch(
            'https://api.allorigins.win/raw?url=' +
            encodeURIComponent(
                'https://api.duckduckgo.com/?q=' +
                query +
                '&format=json&pretty=1'
            )
        );

        const data = await response.json();

        results.innerHTML = '';

        let found = false;

        if(data.RelatedTopics){

            data.RelatedTopics.forEach(item => {

                if(item.FirstURL){

                    found = true;

                    results.innerHTML += `
                        <div class="result">

                            <div class="result-top">
                                ${item.FirstURL}
                            </div>

                            <a href="${item.FirstURL}" target="_blank">
                                ${item.Text || 'Untitled Result'}
                            </a>

                            <p>
                                ${item.Text || 'No description available.'}
                            </p>

                        </div>
                    `;
                }
            });
        }

        if(!found){

            results.innerHTML = `
                <div class="loading">
                    No results found.
                </div>
            `;
        }

    }catch(error){

        console.error(error);

        results.innerHTML = `
            <div class="loading">
                Search failed. Try again later.
            </div>
        `;
    }
}


document.getElementById('searchInput')
.addEventListener('keydown', function(e){

    if(e.key === 'Enter'){
        searchWeb();
    }

});

</script>

</body>
</html>
