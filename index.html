<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlatWeb</title>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#05070a;
    color:white;
    font-family:"JetBrains Mono", monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    flex-direction:column;
    text-align:center;
}

h1{
    font-size:64px;
    margin-bottom:10px;
}

p{
    color:#8b949e;
    margin-bottom:25px;
}

input{
    width:80%;
    max-width:600px;
    padding:16px;
    font-size:18px;
    border-radius:12px;
    border:1px solid #333;
    background:#111;
    color:white;
    outline:none;
}

button{
    margin-top:15px;
    padding:12px 24px;
    border:none;
    border-radius:10px;
    background:#58a6ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#2f81f7;
}

.links{
    margin-top:30px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.links a{
    display:inline-block;
    padding:10px 16px;
    border-radius:10px;
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.1);
}

.links a:hover{
    border-color:#58a6ff;
    color:#58a6ff;
}
</style>
</head>
</html>
