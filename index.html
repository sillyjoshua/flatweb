<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FlatWeb</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#05070a;
    color:white;
    font-family:"JetBrains Mono", monospace;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top left, rgba(88,166,255,.14), transparent 30%),
    radial-gradient(circle at bottom right, rgba(157,107,255,.14), transparent 30%),
    linear-gradient(to bottom, #05070a, #0b1017);

    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;

    background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);

    background-size:40px 40px;

    z-index:-1;

    mask-image:linear-gradient(to bottom, rgba(0,0,0,.7), transparent);
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    font-size:28px;
    font-weight:800;
    letter-spacing:-2px;
}

.brand span{
    color:#58a6ff;
}

.links{
    display:flex;
    gap:24px;
}

.links a{
    color:#8b949e;
    text-decoration:none;
    transition:.2s;
}

.links a:hover{
    color:white;
}

.hero{
    text-align:center;
    margin-top:120px;
}

.logo{
    font-size:120px;
    font-weight:800;
    letter-spacing:-8px;

    background:linear-gradient(
        90deg,
        #58a6ff,
        #9d6bff,
        #5ee7a5,
        #58a6ff
    );

    background-size:300% 300%;

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:gradient 10s ease infinite;
}

@keyframes gradient{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

.subtitle{
    margin-top:20px;
    color:#8b949e;
    font-size:18px;
}

.search-wrap{
    display:flex;
    justify-content:center;
    margin-top:50px;
}

.search-box{
    width:100%;
    max-width:860px;

    display:flex;
    align-items:center;
    gap:14px;

    padding:12px;

    border-radius:28px;

    background:rgba(15,20,27,.88);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(12px);

    box-shadow:
    0 20px 80px rgba(0,0,0,.45);

    transition:.25s;
}

.search-box:focus-within{
    border-color:#58a6ff;

    box-shadow:
    0 0 0 1px rgba(88,166,255,.35),
    0 20px 100px rgba(88,166,255,.12);
}

.search-icon{
    font-size:22px;
    padding-left:12px;
    opacity:.8;
}

.search-box input{
    flex:1;

    background:none;
    border:none;
    outline:none;

    color:white;

    font-size:18px;

    padding:16px 0;

    font-family:"JetBrains Mono", monospace;
}

.search-box input::placeholder{
    color:#6e7681;
}

.search-btn{
    border:none;

    background:linear-gradient(
        135deg,
        #58a6ff,
        #9d6bff
    );

    color:white;

    padding:16px 26px;

    border-radius:18px;

    cursor:pointer;

    font-weight:700;

    font-family:"JetBrains Mono", monospace;

    transition:.2s;
}

.search-btn:hover{
    transform:scale(1.04);
}

.quick-links{
    margin-top:25px;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
}

.quick{
    padding:12px 18px;

    border-radius:14px;

    background:rgba(255,255,255,.03);

    border:1px solid rgba(255,255,255,.08);

    color:#9aa4b2;

    cursor:pointer;

    transition:.2s;
}

.quick:hover{
    border-color:#58a6ff;
    color:white;
    transform:translateY(-2px);
}

.results{
    margin-top:70px;
}

.result{
    background:rgba(15,20,27,.82);

    border:1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:28px;

    margin-bottom:20px;

    backdrop-filter:blur(10px);

    transition:.25s;
}

.result:hover{
    border-color:#58a6ff;
    transform:translateY(-4px);
}

.result-top{
    color:#58a6ff;
    font-size:13px;
    margin-bottom:12px;
    overflow:hidden;
    text-overflow:ellipsis;
}

.result a{
    color:white;
    text-decoration:none;

    font-size:25px;
    font-weight:700;

    line-height:1.4;
}

.result a:hover{
    color:#58a6ff;
}

.result p{
    margin-top:14px;
    color:#b6bec9;
    line-height:1.8;
}

.loading{
    text-align:center;
    margin-top:60px;
    color:#7d8590;
}

.footer{
    margin-top:100px;
    text-align:center;
    color:#6e7681;
    padding-bottom:30px;
}

@media(max-width:700px){

    .logo{
        font-size:72px;
        letter-spacing:-4px;
    }

    .links{
        display:none;
    }

    .search-btn{
        padding:14px 18px;
        font-size:13px;
    }

}

</style>

</head>
<body>

<div class="grid"></div>

<div class="container">

    <div class="nav">

        <div class="brand">
            flat<span>web</span>
        </div>

        <div class="links">
            <a href="#">Search</a>
            <a href="https://discord.gg/WHqUmX29um">Discord</a>
        </div>

    </div>

    <div class="hero">

        <div class="logo">
            FlatWeb
        </div>

        <div class="subtitle">
            Search the modern web instantly.
        </div>

        <div class="search-wrap">

            <div class="search-box">

                <div class="search-icon">
                    ⌕
                </div>

                <input
                type="text"
                id="searchInput"
                placeholder="Search anything..."
                autocomplete="off"
                spellcheck="false">

                <button
                class="search-btn"
                onclick="searchWeb()">

                    Search

                </button>

            </div>

        </div>

        <div class="quick-links">

            <div
            class="quick"
            onclick="quickSearch('ai tools')">

                ai

            </div>

            <div
            class="quick"
            onclick="quickSearch('gaming news')">

                gaming

            </div>

            <div
            class="quick"
            onclick="quickSearch('tech news')">

                tech

            </div>

            <div
            class="quick"
            onclick="quickSearch('programming tutorials')">

                code

            </div>

            <div
            class="quick"
            onclick="quickSearch('music trending')">

                music

            </div>

        </div>

    </div>

    <div
    class="results"
    id="results"></div>

    <div class="footer">
        © 2026 FlatWeb — flatweb.pw
    </div>

</div>

<script>

const input =
document.getElementById("searchInput");

const results =
document.getElementById("results");

function quickSearch(text){

    input.value = text;

    searchWeb();
}

async function searchWeb(push = true){

    const query =
    input.value.trim();

    if(!query) return;

    if(push){

        const url =
        new URL(window.location);

        url.searchParams.set(
            "q",
            query
        );

        history.pushState(
            {},
            "",
            url
        );
    }

    results.innerHTML = `
        <div class="loading">
            Searching...
        </div>
    `;

    try{

        const response = await fetch(

            "https://api.duckduckgo.com/?" +

            new URLSearchParams({
                q: query,
                format: "json",
                pretty: "1",
                no_html: "1",
                skip_disambig: "1"
            })

        );

        const data =
        await response.json();

        results.innerHTML = "";

        let found = 0;

        function addResult(title, url){

            found++;

            results.innerHTML += `

                <div class="result">

                    <div class="result-top">
                        ${url}
                    </div>

                    <a
                    href="${url}"
                    target="_blank">

                        ${title}

                    </a>

                    <p>
                        Search result from DuckDuckGo.
                    </p>

                </div>

            `;
        }

        if(data.AbstractURL){

            addResult(
                data.Heading || query,
                data.AbstractURL
            );

        }

        if(data.RelatedTopics){

            data.RelatedTopics.forEach(item => {

                if(item.FirstURL){

                    addResult(
                        item.Text || "Result",
                        item.FirstURL
                    );

                }

                if(item.Topics){

                    item.Topics.forEach(sub => {

                        if(sub.FirstURL){

                            addResult(
                                sub.Text || "Result",
                                sub.FirstURL
                            );

                        }

                    });

                }

            });

        }

        if(found === 0){

            results.innerHTML = `
                <div class="loading">
                    No results found.
                </div>
            `;
        }

    }catch(err){

        console.error(err);

        results.innerHTML = `
            <div class="loading">
                Search failed.
            </div>
        `;
    }
}

input.addEventListener(
    "keydown",
    e => {

        if(e.key === "Enter"){

            searchWeb();

        }

    }
);

window.addEventListener(
    "load",
    () => {

        const params =
        new URLSearchParams(
            window.location.search
        );

        const q =
        params.get("q");

        if(q){

            input.value = q;

            searchWeb(false);

        }

    }
);

</script>

</body>
</html>
